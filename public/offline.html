<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline | Wireless Terminal</title>
  <meta name="theme-color" content="#2563eb">
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f4f6;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top left, #dbeafe, var(--bg));
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      padding: 1.5rem;
    }

    .card {
      width: 100%;
      max-width: 30rem;
      background: var(--panel);
      border-radius: 0.75rem;
      padding: 1.5rem;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      line-height: 1.2;
    }

    p {
      margin: 0 0 1rem;
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    a,
    button {
      border: 0;
      text-decoration: none;
      font: inherit;
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
    }

    a {
      background: #e5e7eb;
      color: #111827;
    }

    button {
      background: var(--primary);
      color: #fff;
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>You're offline</h1>
    <p>Wireless Terminal is not reachable right now. Check your connection and try again.</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">Try again</button>
      <a href="/">Go home</a>
    </div>
  </main>
</body>
</html>
